<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#FAF8F6"/>

  <!-- top bar -->
  <rect x="0" y="0" width="800" height="66" fill="#FFFFFF"/>
  <rect x="0" y="66" width="800" height="1" fill="#E7E1DD"/>
  <rect x="40" y="24" width="22" height="22" rx="6" fill="#93213E"/>
  <rect x="72" y="27" width="160" height="12" rx="6" fill="#1D1D21" opacity="0.85"/>

  <!-- health score badge -->
  <circle cx="722" cy="33" r="26" fill="none" stroke="#F3DCE2" stroke-width="8"/>
  <circle cx="722" cy="33" r="26" fill="none" stroke="#93213E" stroke-width="8" stroke-linecap="round" stroke-dasharray="128 164" transform="rotate(-90 722 33)"/>
  <text x="722" y="38" font-family="Manrope, sans-serif" font-size="14" font-weight="800" fill="#1D1D21" text-anchor="middle">78</text>

  <!-- donut chart card -->
  <rect x="40" y="96" width="330" height="270" rx="16" fill="#FFFFFF" stroke="#E7E1DD"/>
  <text x="64" y="128" font-family="monospace" font-size="10" fill="#5E1428" opacity="0.8">SPENDING BY CATEGORY</text>
  <g transform="translate(150,240)">
    <circle r="80" fill="none" stroke="#F3DCE2" stroke-width="26"/>
    <circle r="80" fill="none" stroke="#93213E" stroke-width="26" stroke-dasharray="196 503" transform="rotate(-90)"/>
    <circle r="80" fill="none" stroke="#B85470" stroke-width="26" stroke-dasharray="126 503" stroke-dashoffset="-196" transform="rotate(-90)"/>
    <circle r="80" fill="none" stroke="#D28299" stroke-width="26" stroke-dasharray="95 503" stroke-dashoffset="-322" transform="rotate(-90)"/>
  </g>
  <g font-family="monospace" font-size="10" fill="#1D1D21">
    <circle cx="272" cy="200" r="5" fill="#93213E"/><text x="284" y="204" opacity="0.7">Rent · 39%</text>
    <circle cx="272" cy="226" r="5" fill="#B85470"/><text x="284" y="230" opacity="0.7">Food · 25%</text>
    <circle cx="272" cy="252" r="5" fill="#D28299"/><text x="284" y="256" opacity="0.7">Transit · 19%</text>
    <circle cx="272" cy="278" r="5" fill="#F3DCE2"/><text x="284" y="282" opacity="0.7">Other · 17%</text>
  </g>

  <!-- line chart card -->
  <rect x="390" y="96" width="370" height="270" rx="16" fill="#FFFFFF" stroke="#E7E1DD"/>
  <text x="414" y="128" font-family="monospace" font-size="10" fill="#5E1428" opacity="0.8">SPENDING TREND — 6 MONTHS</text>
  <polyline points="420,300 470,270 520,310 570,230 620,260 670,190 720,220" fill="none" stroke="#93213E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="420,300 470,270 520,310 570,230 620,260 670,190 720,220 720,340 420,340" fill="#93213E" opacity="0.08"/>
  <circle cx="670" cy="190" r="5" fill="#93213E"/>
  <rect x="632" y="160" width="76" height="20" rx="10" fill="#93213E"/>
  <text x="646" y="174" font-family="monospace" font-size="9" fill="#fff">Spike +22%</text>

  <!-- transactions list -->
  <rect x="40" y="386" width="720" height="188" rx="16" fill="#FFFFFF" stroke="#E7E1DD"/>
  <text x="64" y="416" font-family="monospace" font-size="10" fill="#5E1428" opacity="0.8">RECENT TRANSACTIONS</text>
  <g font-family="monospace" font-size="10" fill="#1D1D21">
    <rect x="64" y="434" width="80" height="18" rx="9" fill="#F3DCE2"/><text x="76" y="447" fill="#5E1428">Rent</text>
    <text x="160" y="447" opacity="0.7">Monthly apartment payment</text>
    <text x="700" y="447" text-anchor="end" opacity="0.85">-$950</text>

    <rect x="64" y="464" width="80" height="18" rx="9" fill="#F3DCE2"/><text x="82" y="477" fill="#5E1428">Food</text>
    <text x="160" y="477" opacity="0.7">Grocery run</text>
    <text x="700" y="477" text-anchor="end" opacity="0.85">-$86</text>

    <rect x="64" y="494" width="90" height="18" rx="9" fill="#F3DCE2"/><text x="74" y="507" fill="#5E1428">Transit</text>
    <text x="160" y="507" opacity="0.7">Fuel top-up</text>
    <text x="700" y="507" text-anchor="end" opacity="0.85">-$40</text>

    <rect x="64" y="524" width="90" height="18" rx="9" fill="#93213E"/><text x="78" y="537" fill="#fff">Income</text>
    <text x="160" y="537" opacity="0.7">Freelance payment received</text>
    <text x="700" y="537" text-anchor="end" fill="#5E1428" font-weight="700">+$1,200</text>
  </g>
</svg>
