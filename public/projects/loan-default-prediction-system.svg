<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D28299"/><stop offset="0.5" stop-color="#93213E"/><stop offset="1" stop-color="#5E1428"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#0B0B0D"/>

  <!-- top bar -->
  <rect x="0" y="0" width="800" height="64" fill="#141417"/>
  <rect x="40" y="24" width="22" height="22" rx="6" fill="#93213E"/>
  <rect x="72" y="27" width="150" height="12" rx="6" fill="#FFFFFF" opacity="0.85"/>
  <rect x="640" y="20" width="120" height="26" rx="13" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="666" cy="33" r="7" fill="#93213E"/>
  <text x="682" y="37" font-family="monospace" font-size="9" fill="#FFFFFF" opacity="0.8">Live model</text>

  <!-- KPI cards -->
  <g font-family="monospace">
    <rect x="40" y="96" width="220" height="90" rx="14" fill="#1D1D21"/>
    <text x="62" y="128" font-size="10" fill="#FFFFFF" opacity="0.5">DEFAULT RISK</text>
    <text x="62" y="160" font-size="26" fill="#FFFFFF" font-weight="700">18.4%</text>

    <rect x="290" y="96" width="220" height="90" rx="14" fill="#1D1D21"/>
    <text x="312" y="128" font-size="10" fill="#FFFFFF" opacity="0.5">MODEL ACCURACY</text>
    <text x="312" y="160" font-size="26" fill="#D28299" font-weight="700">92.1%</text>

    <rect x="540" y="96" width="220" height="90" rx="14" fill="#1D1D21"/>
    <text x="562" y="128" font-size="10" fill="#FFFFFF" opacity="0.5">PREDICTIONS TODAY</text>
    <text x="562" y="160" font-size="26" fill="#FFFFFF" font-weight="700">1,204</text>
  </g>

  <!-- gauge card -->
  <rect x="40" y="212" width="330" height="230" rx="16" fill="#1D1D21"/>
  <text x="64" y="242" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.5">BORROWER RISK SCORE</text>
  <path d="M 90 380 A 115 115 0 0 1 320 380" fill="none" stroke="#2A2A30" stroke-width="18" stroke-linecap="round"/>
  <path d="M 90 380 A 115 115 0 0 1 320 380" fill="none" stroke="url(#gauge)" stroke-width="18" stroke-linecap="round" stroke-dasharray="240 360" />
  <line x1="205" y1="380" x2="260" y2="320" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="205" cy="380" r="7" fill="#FFFFFF"/>
  <text x="205" y="410" font-family="Manrope, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Medium</text>

  <!-- bar chart card -->
  <rect x="390" y="212" width="370" height="230" rx="16" fill="#1D1D21"/>
  <text x="414" y="242" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.5">DEFAULT PROBABILITY BY SEGMENT</text>
  <g>
    <rect x="420" y="340" width="30" height="70" rx="4" fill="#5E1428"/>
    <rect x="466" y="310" width="30" height="100" rx="4" fill="#93213E"/>
    <rect x="512" y="360" width="30" height="50" rx="4" fill="#5E1428"/>
    <rect x="558" y="290" width="30" height="120" rx="4" fill="#D28299"/>
    <rect x="604" y="330" width="30" height="80" rx="4" fill="#93213E"/>
    <rect x="650" y="350" width="30" height="60" rx="4" fill="#5E1428"/>
    <rect x="696" y="300" width="30" height="110" rx="4" fill="#93213E"/>
  </g>
  <line x1="414" y1="412" x2="742" y2="412" stroke="#2A2A30" stroke-width="1"/>

  <!-- prediction history table -->
  <rect x="40" y="464" width="720" height="110" rx="16" fill="#1D1D21"/>
  <text x="64" y="490" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.5">PREDICTION HISTORY</text>
  <g font-family="monospace" font-size="10" fill="#FFFFFF">
    <rect x="64" y="506" width="640" height="1" fill="#2A2A30"/>
    <text x="64" y="524" opacity="0.5">ID</text>
    <text x="140" y="524" opacity="0.5">APPLICANT</text>
    <text x="420" y="524" opacity="0.5">RISK</text>
    <text x="560" y="524" opacity="0.5">STATUS</text>

    <text x="64" y="546">#4471</text>
    <text x="140" y="546" opacity="0.8">A. Karim</text>
    <text x="420" y="546" fill="#D28299">Low</text>
    <rect x="560" y="536" width="52" height="16" rx="8" fill="#93213E"/>
    <text x="568" y="548" font-size="8">Approved</text>

    <text x="64" y="566">#4472</text>
    <text x="140" y="566" opacity="0.8">S. Fatima</text>
    <text x="420" y="566" fill="#B85470">High</text>
    <rect x="560" y="556" width="52" height="16" rx="8" fill="#5E1428"/>
    <text x="568" y="568" font-size="8">Review</text>
  </g>
</svg>
